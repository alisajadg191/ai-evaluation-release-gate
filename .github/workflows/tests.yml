name: Tests and release gate
on: [push, pull_request]
permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: evaluation
          POSTGRES_PASSWORD: evaluation-local
          POSTGRES_DB: evaluation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U evaluation -d evaluation"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://evaluation:evaluation-local@127.0.0.1:5432/evaluation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check static/app.js
      - name: Verify the release gate exit codes
        run: |
          python -m cli run demo-baseline --output /tmp/baseline.json
          python -m cli run demo-regression --output /tmp/regression.json
          python -m cli run demo-fixed --output /tmp/candidate.json
          exit_code=0
          python -m cli gate /tmp/baseline.json /tmp/regression.json || exit_code=$?
          test "$exit_code" -eq 1
          python -m cli gate /tmp/baseline.json /tmp/candidate.json
      - name: Verify the deployed API and worker
        run: |
          docker compose up -d --build --wait
          python tests/compose_smoke.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
