services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: evaluation
      POSTGRES_USER: evaluation
      POSTGRES_PASSWORD: evaluation-local
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - evaluation-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U evaluation -d evaluation"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment: &settings
      DATABASE_URL: postgresql://evaluation:evaluation-local@db:5432/evaluation
      SUPPORT_BASELINE_URL: ${SUPPORT_BASELINE_URL:-}
      SUPPORT_BASELINE_EMAIL: ${SUPPORT_BASELINE_EMAIL:-}
      SUPPORT_BASELINE_PASSWORD: ${SUPPORT_BASELINE_PASSWORD:-}
      SUPPORT_CANDIDATE_URL: ${SUPPORT_CANDIDATE_URL:-}
      SUPPORT_CANDIDATE_EMAIL: ${SUPPORT_CANDIDATE_EMAIL:-}
      SUPPORT_CANDIDATE_PASSWORD: ${SUPPORT_CANDIDATE_PASSWORD:-}
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8010/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build: .
    command: ["python", "-m", "worker"]
    environment: *settings
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  evaluation-data:
